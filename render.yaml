services:
  - type: web
    name: ashhad-lubna-wedding-invitation
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NITRO_PRESET
        value: node-server
      - key: VITE_SITE_URL
        sync: false
